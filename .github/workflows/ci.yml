name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python with uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
          enable-cache: false

      - name: Create test .env file
        shell: bash
        run: |
          cat > .env << 'EOF'
          LLM_DEFAULT_PROVIDER=groq
          LLM_DEFAULT_MODEL=llama-3.1-8b-instant
          LLM_DEFAULT_TEMPERATURE=0.7
          LLM_DEFAULT_MAX_TOKENS=500
          LLM_PROFILE_EXECUTOR_PROVIDER=groq
          LLM_PROFILE_EXECUTOR_MODEL=llama-3.1-8b-instant
          LLM_PROFILE_EXECUTOR_TEMPERATURE=0.5
          LLM_PROFILE_EXECUTOR_MAX_TOKENS=1000
          LLM_PROFILE_SUPERVISOR_PROVIDER=groq
          LLM_PROFILE_SUPERVISOR_MODEL=llama-3.1-70b-versatile
          LLM_PROFILE_SUPERVISOR_TEMPERATURE=0.3
          LLM_PROFILE_SUPERVISOR_MAX_TOKENS=2000
          DATA_PATH=data
          CACHE_DIR=.cache/vector_stores
          LOG_LEVEL=INFO
          POKEAPI_MCP_SERVER_URL=http://localhost:3000
          POKEAPI_MCP_ENABLED=false
          # Provider API keys (placeholders for CI)
          GROQ_API_KEY=gsk_test_key
          OPENAI_API_KEY=sk_test_key
          ANTHROPIC_API_KEY=ak_test_key
          EOF

      - name: Sync dependencies (including dev)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          uv sync --dev 2>&1 | tee logs/uv_sync.txt

      - name: Run test suite (with report)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          uv run pytest tests/ -v --tb=short --junitxml=reports/pytest.xml 2>&1 | tee reports/test_output.txt

      - name: Add logs summary to job
        if: always()
        shell: bash
        run: |
          echo "## CI Logs Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "\n### uv sync (last 500 lines)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f logs/uv_sync.txt ]; then tail -n 500 logs/uv_sync.txt >> "$GITHUB_STEP_SUMMARY"; else echo "(no uv_sync.txt)" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "\n### pytest output (last 500 lines)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/test_output.txt ]; then tail -n 500 reports/test_output.txt >> "$GITHUB_STEP_SUMMARY"; else echo "(no test_output.txt)" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "\n### pytest errors (grep)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/test_output.txt ]; then grep -i -E "(FAIL|ERROR|Traceback|AssertionError)" reports/test_output.txt | tail -n 200 >> "$GITHUB_STEP_SUMMARY" || true; else echo "(no test_output.txt)" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload logs and reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            logs/uv_sync.txt
            reports/pytest.xml
            reports/test_output.txt
