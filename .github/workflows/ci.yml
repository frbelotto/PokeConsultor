name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python with uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Sync dependencies (including dev)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          uv sync --dev 2>&1 | tee logs/uv_sync.txt

      - name: Run test suite (with report)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          uv run pytest tests/ -v --tb=short --junitxml=reports/pytest.xml 2>&1 | tee reports/test_output.txt

      - name: Upload logs and reports when failing
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            logs/uv_sync.txt
            reports/pytest.xml
            reports/test_output.txt
