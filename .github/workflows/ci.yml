name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python with uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
          enable-cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libraries required for PySide6 / Qt on headless runners
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-glx libegl1-mesa libx11-xcb1 libxcb-xinerama0 libxkbcommon-x11-0

      - name: Create test .env file
        shell: bash
        run: |
          cat > .env << 'EOF'
          LLM_DEFAULT_PROVIDER=groq
          LLM_DEFAULT_MODEL=llama-3.1-8b-instant
          LLM_DEFAULT_TEMPERATURE=0.7
          LLM_DEFAULT_MAX_TOKENS=500
          LLM_PROFILE_EXECUTOR_PROVIDER=groq
          LLM_PROFILE_EXECUTOR_MODEL=llama-3.1-8b-instant
          LLM_PROFILE_EXECUTOR_TEMPERATURE=0.5
          LLM_PROFILE_EXECUTOR_MAX_TOKENS=1000
          LLM_PROFILE_SUPERVISOR_PROVIDER=groq
          LLM_PROFILE_SUPERVISOR_MODEL=llama-3.1-70b-versatile
          LLM_PROFILE_SUPERVISOR_TEMPERATURE=0.3
          LLM_PROFILE_SUPERVISOR_MAX_TOKENS=2000
          DATA_PATH=data
          CACHE_DIR=.cache
          LOG_LEVEL=INFO
          POKEAPI_MCP_SERVER_URL=http://localhost:3000
          POKEAPI_MCP_ENABLED=false
          # Provider API keys (placeholders for CI)
          GROQ_API_KEY=gsk_test_key
          EOF

      - name: Sync dependencies (including dev)
        run: uv sync --dev

      - name: Run test suite (with report)
        run: |
          mkdir -p reports
          export PYTHONPATH="${PWD}:$PYTHONPATH"
          uv run pytest tests/ -v --tb=short --junitxml=reports/pytest.xml

      - name: Display logs if failed
        if: failure()
        run: cat reports/test_output.txt || echo "(no test_output.txt)"

      - name: Add logs summary to job
        if: always()
        shell: bash
        run: |
          echo "## CI Test Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/test_output.txt ]; then
            echo "### Test Output" >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 reports/test_output.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
