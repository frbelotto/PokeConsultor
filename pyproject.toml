[project]
name = "pokeconsultor"
version = "0.1.0"
description = "AI-powered Pokemon consultant with safety supervision"
readme = "README.md"
authors = [
    { name = "Fábio Radicchi Belotto", email = "fabio_belotto@hotmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.4.0",
    "langchain-groq>=0.2.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "email-validator>=2.3.0",
]

[tool.setuptools]
packages = ["pokeconsultor"]

[tool.setuptools.package-data]
pokeconsultor = []

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
    "mypy>=1.19.0",
    "taskipy>=1.14.0",
    "ipykernel>=7.1.0",
]

[tool.taskipy.tasks]
format = 'uvx ruff format'
run = "python -m main"
test = "pytest tests/ -v"
test-fast = "pytest tests/ -v -m 'not slow and not integration'"
test-all = "pytest tests/ -v --tb=short"

