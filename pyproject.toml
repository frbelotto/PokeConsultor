[project]
name = "pokeconsultor"
version = "0.2.0"
description = "AI-powered consultant"
readme = "README.md"
authors = [
    { name = "Fábio Radicchi Belotto", email = "fabio_belotto@hotmail.com" }
]
requires-python = ">=3.11, <3.14"
dependencies = [
    "langchain>=1.2.1",
    "langchain-community>=0.4.1",
    "langchain-groq>=1.1.1",
    "langchain-huggingface>=0.1.0",
    "pdfplumber>=0.11.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "sentence-transformers>=3.0.1",
    "numpy>=1.26.0",
    "langchain-chroma>=1.1.0",
    "torch>=2.4.0, <2.6.0",
    "pyside6>=6.10.1",
]

[tool.setuptools]
packages = ["pokeconsultor"]

[tool.setuptools.package-data]
pokeconsultor = []

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "faker>=33.0.0",
    "ruff>=0.14.0",
    "mypy>=1.19.0",
    "taskipy>=1.14.0",
    "ipykernel>=7.1.0",
]

[tool.taskipy.tasks]
format = 'uvx ruff format'
run = "python -m main"
test = "pytest tests/ -v"
test-fast = "pytest tests/ -v -m 'not slow and not integration'"
test-all = "pytest tests/ -v --tb=short"
type-check = "mypy pokeconsultor/"

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
markers = [
    "integration: marca testes de integração"
]
pythonpath = [
  "."
]

# Caso queria utilizar o AMD Rocm, no fedora (meu caso), siga este manual:https://medium.com/@anvesh.jhuboo/rocm-pytorch-on-fedora-51224563e5be e ajuste a versão do rocm ao final conforme estiver disponível
# Se você utilizar o uv run ele potencialmente substituirá sua versão do pytorch, então cuidado. Utilize este código para recuperar uv pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/rocm7.1
