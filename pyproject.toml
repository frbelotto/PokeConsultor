[project]
name = "pokeconsultor"
version = "0.1.0"
description = "AI-powered Pokemon consultant with safety supervision"
readme = "README.md"
authors = [
    { name = "Fábio Radicchi Belotto", email = "fabio_belotto@hotmail.com" }
]
requires-python = ">=3.11, <3.14"
dependencies = [
    "faiss-cpu>=1.13.2",
    "langchain>=1.2.1",
    "langchain-community>=0.4.1",
    "langchain-groq>=1.1.1",
    "langchain-huggingface>=0.1.0",
    "pdfplumber>=0.11.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "sentence-transformers>=3.0.1",
    "numpy>=1.26.0",
    "nltk>=3.9.1",
]

[tool.setuptools]
packages = ["pokeconsultor"]

[tool.setuptools.package-data]
pokeconsultor = []

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "faker>=33.0.0",
    "ruff>=0.14.0",
    "mypy>=1.19.0",
    "taskipy>=1.14.0",
    "ipykernel>=7.1.0",
]

[tool.taskipy.tasks]
format = 'uvx ruff format'
run = "python -m main"
test = "pytest tests/ -v"
test-fast = "pytest tests/ -v -m 'not slow and not integration'"
test-all = "pytest tests/ -v --tb=short"
type-check = "mypy pokeconsultor/"

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

